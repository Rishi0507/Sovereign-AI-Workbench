# TLS termination for the plant LAN. The workbench itself listens on 127.0.0.1:8080 only.
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 60m;

  server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/tls/workbench.crt;
    ssl_certificate_key /etc/nginx/tls/workbench.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
      proxy_pass http://127.0.0.1:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 300s;
      # In production the directory adapter sets the authenticated user; never trust X-User from clients.
      proxy_set_header X-User "";
    }
  }
}
