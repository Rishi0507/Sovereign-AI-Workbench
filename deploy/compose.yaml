# Reference docker-compose bundle for the target server (Profile S). Artifact only.
# The workbench application and the two daemons run as systemd services (deploy/systemd);
# this bundle runs the model servers and the TLS proxy.
# Every service binds to loopback; the reverse proxy on 443 is the only LAN-facing listener.
# Images are loaded from the signed bundle with `docker load` and pinned by digest.

x-offline-env: &offline-env
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_NO_USAGE_STATS: "1"
  DO_NOT_TRACK: "1"

services:
  router-classifier:
    image: workbench/llamacpp@sha256:REPLACE_WITH_DIGEST
    command: ["--model", "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--host", "127.0.0.1", "--port", "8010"]
    network_mode: host
    environment: *offline-env
    volumes: ["/srv/models:/models:ro"]
    restart: unless-stopped

  vllm:
    # Starts the servers in the order written by `workbench registry render-serve --profile S`:
    # swap slot first, put to sleep, then the residents.
    image: vllm/vllm-openai@sha256:REPLACE_WITH_DIGEST
    entrypoint: ["bash", "/deploy/vllm_commands.sh"]
    network_mode: host
    ipc: host
    environment: *offline-env
    volumes:
      - /srv/models:/models:ro
      - ./vllm_commands.sh:/deploy/vllm_commands.sh:ro
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    restart: unless-stopped

  proxy:
    image: nginx@sha256:REPLACE_WITH_DIGEST
    network_mode: host        # reaches the app on 127.0.0.1:8080; nftables admits 443 from the LAN only
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/workbench/tls:/etc/nginx/tls:ro
    restart: unless-stopped
