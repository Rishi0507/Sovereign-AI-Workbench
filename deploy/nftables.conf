#!/usr/sbin/nft -f
# Sovereign AI Workbench host firewall (README section 6.1).
# Replace 10.20.0.0/24, 10.20.0.10 and 10.20.0.11 with your LAN, directory server and log host.
# Artifact only: nothing in the application applies this file.

table inet sovereign {
  counter egress_blocked {}

  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ip saddr 10.20.0.0/24 tcp dport 443 accept          # LAN clients reach the UI only
    # ip saddr 10.20.0.5 tcp dport 22 accept            # optional: admin SSH from one jump host
  }

  chain output {
    type filter hook output priority 0; policy drop;
    oif "lo" accept
    ct state established,related accept                 # replies to LAN clients
    ip daddr 10.20.0.10 tcp dport 636 accept            # allowlist: directory server (LDAPS)
    # ip daddr 10.20.0.11 tcp dport 6514 accept         # optional: LAN log host (syslog over TLS)
    log prefix "EGRESS-BLOCK " counter name "egress_blocked" drop
  }
}
