# Hosted models, used when llm_backend is "groq".
#
# This stands in for the on-premises inference layer on a machine without a GPU. The target
# deployment serves the registry models with vLLM on loopback (llm_backend "openai"); the client,
# the registry names and the agent loop are the same either way, only the endpoint differs.
#
# The workbench keeps its own model names (config/models.yaml) so routing, quality tables and the
# model panel stay unchanged. This file only says which hosted model answers for each of them.
# The key is read from the environment variable named below; it never appears in this file.
base_url: https://api.groq.com/openai/v1
key_env: GROQ_API_KEY

# Calls are spaced out and never sent in parallel, so a free plan is not exhausted in a burst.
pacing:
  min_interval_s: 1.5       # shortest gap between two calls
  max_concurrency: 1        # one call at a time
  max_retries: 4            # on a 429, wait for the time the service asks for, then retry
  max_wait_s: 90            # give up waiting beyond this and fall back to the offline rules

# Thinking models spend tokens before they answer; "low" keeps that short. Empty to leave it alone.
reasoning_effort: low

# The label-salted prefix cache belongs to a local vLLM; a hosted service refuses the field.
cache_salt: false

models:
  qwen3-vl-8b: openai/gpt-oss-20b        # reading and summarising: the lighter model, and its own rate limit
  qwen2.5-coder-7b: qwen/qwen3.8-27b
  gpt-oss-20b: openai/gpt-oss-120b       # the escalation model, for reasoning and comparison
  granite-3.3-8b: openai/gpt-oss-20b
  qwen2.5-1.5b-instruct: openai/gpt-oss-20b
default: openai/gpt-oss-20b

# The model that writes conversational replies and sorts incoming messages.
chat: openai/gpt-oss-20b
