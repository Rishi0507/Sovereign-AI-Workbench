    name: Plant engineer
    groups: [plant-a]
    clearance: Confidential
    compartments: []
    roles: [engineer, approver]
  buyer1:
    name: Procurement buyer
    groups: [proc]
    clearance: Secret
    compartments: [VENDOR-COMMERCIAL]
