{% extends "base.html" %}
{% block content %}
<div class="page">
  <h1>Security</h1>
  <section class="block" id="net-status"><div class="loading"><span class="spinner"></span></div></section>
  <section class="block">
    <h2>Blocked connection attempts</h2>
    <div id="events"></div>
  </section>
  <section class="block">
    <div class="block-head"><h2>Audit log</h2><button class="btn" id="verify-audit" type="button">Verify</button></div>
    <div id="audit"></div>
  </section>
  <section class="block">
    <h2>Waiting for approval</h2>
    <div id="requests"></div>
  </section>
  <details class="more">
    <summary>Procedure revision impact</summary>
    <form id="impact-form" class="inline-form">
      <input class="input" id="impact-doc" value="SOP-MECH-014" aria-label="Document number">
      <input class="input narrow" id="impact-rev" value="5" aria-label="Revision">
      <button class="btn" type="submit">Show</button>
    </form>
    <div id="impact"></div>
  </details>
</div>
{% endblock %}
