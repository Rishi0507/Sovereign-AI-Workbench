{% extends "base.html" %}
{% block content %}
<section class="home">
  <h1 class="greeting">What can I help you prepare?</h1>
  <form class="composer" id="composer" autocomplete="off">
    <div class="attached" id="attached"></div>
    <textarea id="task-text" rows="1" placeholder="Describe the task, or ask a question" required></textarea>
    <div class="composer-bar">
      <button class="icon-btn" type="button" id="attach-btn" aria-label="Attach files" title="Attach files">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.5 6.5l-6 6a1.8 1.8 0 002.5 2.5l6.2-6.2a3.5 3.5 0 00-5-5L5 10a5.2 5.2 0 007.4 7.4l5-5"/></svg>
      </button>
      <span class="grow"></span>
      <button class="send" type="submit" id="send-btn" aria-label="Start task" disabled>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5"/></svg>
      </button>
    </div>
    <div class="picker" id="picker" hidden>
      <div class="picker-head">
        <strong>Files in this workspace</strong>
        <label class="link-btn">Upload<input type="file" id="upload-input" hidden></label>
      </div>
      <div class="picker-list" id="picker-list"></div>
      <label class="picker-option"><input type="checkbox" id="no-template"> Plan from scratch instead of using a saved template</label>
    </div>
  </form>
  <div class="starters" id="starters"></div>
</section>
{% endblock %}
