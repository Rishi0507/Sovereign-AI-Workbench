{% extends "base.html" %}
{% block data %}data-task="{{ task_id }}"{% endblock %}
{% block content %}
<div class="thread-page">
  <header class="thread-head" id="thread-head"></header>
  <div class="thread" id="thread"><div class="loading"><span class="spinner"></span></div></div>
  <form class="composer followup" id="followup" hidden autocomplete="off">
    <textarea id="followup-text" rows="1" placeholder="Ask a follow-up about these documents"></textarea>
    <div class="composer-bar"><span class="grow"></span>
      <button class="send" type="submit" aria-label="Ask"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5"/></svg></button>
    </div>
  </form>
</div>
{% endblock %}
