{% extends "base.html" %}
{% block content %}
<div class="page library">
  <header class="lib-head">
    <div>
      <h1>Library</h1>
      <p class="lead">Everything the workbench has produced and every decision made on it.</p>
    </div>
    <label class="search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M9 15.5a6.5 6.5 0 100-13 6.5 6.5 0 000 13zM13.8 13.8L17.5 17.5"/></svg>
      <span class="sr-only">Search</span>
      <input id="lib-search" type="search" placeholder="Search documents and tasks" autocomplete="off">
    </label>
  </header>
  <div id="lib-tabs"></div>
  <div class="lib-filters" id="lib-filters"></div>
  <div class="tab-stage" id="lib-body"><div class="loading"><span class="spinner"></span></div></div>
</div>
{% endblock %}
