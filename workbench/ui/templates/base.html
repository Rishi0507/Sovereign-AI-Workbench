<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Workbench</title>
  <link rel="icon" href="/static/mark.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
  <script src="/static/app.js?v={{ asset_version }}" defer></script>
</head>
<body data-page="{{ page }}" {% block data %}{% endblock %}>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/"><img src="/static/mark.svg" alt="" width="22" height="22"><span>Workbench</span></a>
      <a class="new-task" href="/"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M9 4H5.5A1.5 1.5 0 004 5.5v9A1.5 1.5 0 005.5 16h9a1.5 1.5 0 001.5-1.5V11M14.2 3.8a1.5 1.5 0 012.1 2.1L10.5 11.7 8 12.3l.6-2.5z"/></svg>New task</a>
      <a class="new-task nav-link" href="/plant" data-nav="plant"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.2l5.5 3.2v6.2L10 15.8 4.5 12.6V6.4zM10 3.2v5.1m0 0l5.5-1.9M10 8.3L4.5 6.4"/></svg>Plant</a>
      <a class="new-task nav-link" href="/library" data-nav="library"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 4.5h5l1.5 2h6.5v9h-13zM3.5 8.5h13"/></svg>Library<span class="nav-count" id="nav-count" hidden></span></a>
      <nav class="recent" id="recent" aria-label="Recent tasks"></nav>
      <div class="account">
        <button class="account-btn" id="account-btn" type="button" aria-haspopup="menu" aria-expanded="false">
          <span class="avatar" id="avatar"></span>
          <span class="account-name" id="account-name"></span>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 12l4-4 4 4"/></svg>
        </button>
        <div class="menu" id="account-menu" role="menu" hidden>
          <p class="menu-head">Signed in as</p>
          <div class="people" id="user-list"></div>
          <p class="menu-note">Development sign-in. On a real server this comes from the directory.</p>
          <div class="menu-sep"></div>
          <a class="menu-item" href="/models" role="menuitem">Models</a>
          <a class="menu-item" href="/security" role="menuitem">Security</a>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open sidebar">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
        </button>
        <label class="ws-picker"{% if page != "home" %} hidden{% endif %}>
          <span class="sr-only">Workspace</span>
          <select id="ws-select"></select>
        </label>
        <span class="grow"></span>
        <div class="net" id="net" hidden>
          <button class="net-btn" id="net-btn" type="button" aria-haspopup="dialog">
            <span class="net-dot" id="net-dot"></span><span id="net-text"></span>
          </button>
          <div class="popover" id="net-pop" hidden></div>
        </div>
      </header>
      <main class="content" id="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <div class="panel" id="panel" hidden>
    <div class="panel-scrim" data-close></div>
    <section class="panel-body" role="dialog" aria-modal="true" aria-labelledby="panel-title">
      <header class="panel-head"><h2 id="panel-title"></h2><button class="icon-btn" data-close type="button" aria-label="Close"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button></header>
      <div class="panel-content" id="panel-content"></div>
    </section>
  </div>
  <div class="modal" id="modal" hidden>
    <div class="modal-scrim" data-close></div>
    <section class="modal-body" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="panel-head"><h2 id="modal-title"></h2><button class="icon-btn" data-close type="button" aria-label="Close"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button></header>
      <div class="panel-content" id="modal-content"></div>
    </section>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
