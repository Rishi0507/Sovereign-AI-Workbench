[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-workbench"
version = "0.1.0"
description = "Agentic layer of the Sovereign AI Workbench: routing, planning, evidence, tools, checks, labels and audit for air-gapped deployments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "sympy>=1.12",
    "pint>=0.23",
    "pandas>=2.2",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-socket>=0.7",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "freezegun>=1.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
workbench = "workbench.cli:app"

[tool.setuptools.packages.find]
include = ["workbench*"]

[tool.setuptools.package-data]
workbench = ["ui/templates/*.html", "ui/static/*", "ui/static/fonts/*", "llm/prompts/*.j2", "security/probe/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost,::1"
markers = [
    "go_integration: runs against the real sandboxd and egressd binaries",
    "ui: drives the interface in Chrome (needs Playwright and Chrome)",
]
filterwarnings = [
    "ignore::DeprecationWarning:docx.*",
    "ignore::DeprecationWarning:pptx.*",
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:The anyio.abc.BlockingPortal alias:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["go", "fixtures", "var", "run"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF012", "B008", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
follow_imports = "silent"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["workbench.core.*", "workbench.planning.*", "workbench.checks.*", "workbench.router.*"]
strict = true

[tool.coverage.run]
source = ["workbench"]
omit = ["workbench/adapters/optional/*"]
